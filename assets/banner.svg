<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="KYORA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0814">
        <animate attributeName="stop-color" values="#0B0814;#12092A;#0B0814" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#08080F"/>
      <stop offset="100%" stop-color="#0E0A1E">
        <animate attributeName="stop-color" values="#0E0A1E;#160B2E;#0E0A1E" dur="18s" repeatCount="indefinite"/>
      </stop>
      <animate attributeName="x1" values="0;0.35;0" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="0;0.3;0" dur="24s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="o1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="o3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="-1.2;1.2;-1.2" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2.4;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E9E2FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <circle cx="240" cy="80" r="330" fill="url(#o1)">
    <animate attributeName="cx" values="240;430;300;240" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;170;40;80" dur="23s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="290" r="340" fill="url(#o2)">
    <animate attributeName="cx" values="980;790;900;980" dur="21s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="290;190;330;290" dur="17s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="330" r="260" fill="url(#o3)">
    <animate attributeName="cx" values="620;760;500;620" dur="25s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="330;270;350;330" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="723" cy="64" r="2.5" fill="#C4B5FD" opacity="0.26"><animate attributeName="cy" values="64;-5;64" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.26;0.48;0.26" dur="15s" repeatCount="indefinite"/></circle>
  <circle cx="178" cy="59" r="2.5" fill="#C4B5FD" opacity="0.19"><animate attributeName="cy" values="59;-12;59" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.19;0.47;0.19" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="245" cy="103" r="2.0" fill="#C4B5FD" opacity="0.23"><animate attributeName="cy" values="103;15;103" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.23;0.65;0.23" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="186" cy="65" r="2.0" fill="#C4B5FD" opacity="0.11"><animate attributeName="cy" values="65;-23;65" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.11;0.75;0.11" dur="15s" repeatCount="indefinite"/></circle>
  <circle cx="653" cy="100" r="1.8" fill="#C4B5FD" opacity="0.16"><animate attributeName="cy" values="100;-33;100" dur="17s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.16;0.74;0.16" dur="17s" repeatCount="indefinite"/></circle>
  <circle cx="430" cy="136" r="1.3" fill="#C4B5FD" opacity="0.12"><animate attributeName="cy" values="136;29;136" dur="18s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.12;0.7;0.12" dur="18s" repeatCount="indefinite"/></circle>
  <circle cx="182" cy="312" r="2.1" fill="#C4B5FD" opacity="0.26"><animate attributeName="cy" values="312;198;312" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.26;0.61;0.26" dur="16s" repeatCount="indefinite"/></circle>
  <circle cx="988" cy="132" r="1.7" fill="#C4B5FD" opacity="0.12"><animate attributeName="cy" values="132;41;132" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.12;0.56;0.12" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="1073" cy="269" r="2.4" fill="#C4B5FD" opacity="0.22"><animate attributeName="cy" values="269;173;269" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.22;0.48;0.22" dur="20s" repeatCount="indefinite"/></circle>
  <circle cx="1108" cy="117" r="1.8" fill="#C4B5FD" opacity="0.18"><animate attributeName="cy" values="117;-5;117" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.18;0.79;0.18" dur="14s" repeatCount="indefinite"/></circle>
  <circle cx="218" cy="200" r="2.3" fill="#C4B5FD" opacity="0.24"><animate attributeName="cy" values="200;97;200" dur="18s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.24;0.66;0.24" dur="18s" repeatCount="indefinite"/></circle>
  <circle cx="994" cy="178" r="1.3" fill="#C4B5FD" opacity="0.24"><animate attributeName="cy" values="178;58;178" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.24;0.47;0.24" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="694" cy="268" r="2.1" fill="#C4B5FD" opacity="0.24"><animate attributeName="cy" values="268;172;268" dur="19s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.24;0.76;0.24" dur="19s" repeatCount="indefinite"/></circle>
  <circle cx="770" cy="221" r="1.2" fill="#C4B5FD" opacity="0.22"><animate attributeName="cy" values="221;140;221" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.22;0.62;0.22" dur="16s" repeatCount="indefinite"/></circle>
  <circle cx="506" cy="166" r="2.3" fill="#C4B5FD" opacity="0.18"><animate attributeName="cy" values="166;56;166" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.18;0.75;0.18" dur="11s" repeatCount="indefinite"/></circle>
  <circle cx="225" cy="182" r="1.4" fill="#C4B5FD" opacity="0.26"><animate attributeName="cy" values="182;105;182" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.26;0.75;0.26" dur="15s" repeatCount="indefinite"/></circle>

  <rect x="-160" y="-40" width="120" height="440" fill="url(#sweep)" opacity="0.10" transform="rotate(12 600 180)">
    <animate attributeName="x" values="-220;1320" dur="8.5s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(600 66)">
    <rect x="-92" y="-15" width="184" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.55"/>
    <circle cx="-66" cy="0" r="4.6" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4.6;5.6;4.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="10" y="5" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="12.5" font-weight="700" letter-spacing="2.4" fill="#C4B5FD">AKTIF DIKEMBANGKAN</text>
  </g>

  <text x="600" y="196" text-anchor="middle" filter="url(#glow)"
        font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="98" font-weight="800" letter-spacing="10" fill="#8B5CF6" opacity="0.55">KYORA</text>
  <text x="600" y="196" text-anchor="middle"
        font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="98" font-weight="800" letter-spacing="10" fill="url(#word)">KYORA</text>

  <text x="600" y="240" text-anchor="middle"
        font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="17" font-weight="600" letter-spacing="6.5" fill="#B9B4C7">STREAM ANIME UNTUK ANDROID</text>

  <rect x="470" y="266" width="260" height="2.6" rx="1.3" fill="url(#bar)">
    <animate attributeName="width" values="90;260;90" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="555;470;555" dur="6s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(375 300)">
    <rect x="0" y="-12" width="132" height="24" rx="12" fill="#14121B" stroke="#2B2738"/>
    <text x="66" y="4" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#9C97AC">ANDROID 8.0+</text>
  </g>
  <g transform="translate(525 300)">
    <rect x="0" y="-12" width="132" height="24" rx="12" fill="#14121B" stroke="#2B2738"/>
    <text x="66" y="4" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#9C97AC">TEMA GELAP</text>
  </g>
  <g transform="translate(675 300)">
    <rect x="0" y="-12" width="132" height="24" rx="12" fill="#14121B" stroke="#2B2738"/>
    <text x="66" y="4" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
          font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#9C97AC">SUBTITLE</text>
  </g>
</svg>
