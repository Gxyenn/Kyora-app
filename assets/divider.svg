<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;0.6;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.6;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1200" height="1.6" rx="0.8" fill="url(#l)"/>
  <circle cx="600" cy="12" r="3.2" fill="#C4B5FD" opacity="0.9">
    <animate attributeName="r" values="2.4;3.6;2.4" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.4s" repeatCount="indefinite"/>
  </circle>
</svg>
